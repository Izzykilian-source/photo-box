<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#fff8f0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Cute Photobox ♡ | Korean Photobooth Studio</title>
    <meta name="description" content="Korean photobooth & Life4Cuts aesthetic photo studio with custom frames, stickers, filters, and photo upload." />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Prevent accidental gesture zoom and double-tap zoom on iOS Safari / Android
      document.addEventListener('gesturestart', function (e) {
        e.preventDefault()
      })
      let lastTouchEnd = 0
      document.addEventListener(
        'touchend',
        function (e) {
          const now = Date.now()
          if (now - lastTouchEnd <= 300) {
            e.preventDefault()
          }
          lastTouchEnd = now
        },
        false
      )
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
